﻿
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Registration</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body>

    <table border="1" style="width:100%" cellpadding="12">
        <tr height="15">
            <td colspan="8"></td>
        </tr>
        <tr align="center" height="40">
            <td width="5%"></td>
            <td width="35%">LOGO</td>
            <td width="10%">צור<br>קשר</td>
            <td width="10%">תקנון</td>
            <td width="10%">אודות</td>
            <td width="10%">על<br>הפרויקט</td>
            <td width="15%"></td>
            <td width="5%"></td>
        </tr>
        <tr height="60">
            <td bgcolor="lightblue" colspan="8" width="100%" align="center">
                <font color="green" size="5"><b>דף הרשמה</b></font>
            </td>
        </tr>
    </table>

    <br>

    <table border="1" style="width:100%; height:calc(100% - 160px);" cellpadding="10">
        <tr>
            <td width="15%" style="border:none;"></td>

            <td width="35%" valign="top">
                <table border="0" width="100%" cellpadding="0" cellspacing="10">
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right">
                                        <input type="text" placeholder="טלפון נייד" style="width:55%; text-align:right;">
                                        <select><option>052</option><option>050</option><option>054</option></select>
                                    </td>
                                    <td width="25%" align="left"><b>:טלפון</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right">
                                        <select><option>2025</option></select>
                                        <select><option>10</option></select>
                                        <select><option>16</option></select>
                                    </td>
                                    <td width="25%" align="left"><b>:תאריך לידה</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="center">
                                        <table border="1" cellpadding="2" style="border-collapse:collapse; display:inline-table;">
                                            <tr>
                                                <td>זכר <input type="radio" name="g"></td>
                                                <td>נקבה <input type="radio" name="g"></td>
                                            </tr>
                                        </table>
                                    </td>
                                    <td width="25%" align="left"><b>:מגדר</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right">
                                        <input type="checkbox"> נא לעיין בתקנון ולאשר את <font color="blue"><u>תנאי שימוש</u></font> באתר
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="center" style="padding:4px;">
                                        <input type="submit" value="Submit" style="background-color:#4CAF50; color:white; width:100%; padding:10px; font-size:16px; border:none; cursor:pointer; font-weight:bold;">
                                    </td>
                                    <td width="25%"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" style="border-collapse:collapse;">
                                <tr height="80">
                                    <td width="8%"></td>
                                    <td></td>
                                    <td width="25%"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>

            <td width="35%" valign="top">
                <table border="0" width="100%" cellpadding="0" cellspacing="10">
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right"><input type="text" placeholder="שם פרטי" style="width:95%; text-align:right;"></td>
                                    <td width="25%" align="left"><b>:שם פרטי</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right"><input type="text" placeholder="שם משפחה" style="width:95%; text-align:right;"></td>
                                    <td width="25%" align="left"><b>:שם משפחה</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right"><input type="email" placeholder="Email" style="width:95%; text-align:left;"></td>
                                    <td width="25%" align="left"><b>:Email</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right">
                                        <input type="password" placeholder="סיסמה" style="width:95%; text-align:right;"><br>
                                        <input type="checkbox"> Show Password
                                    </td>
                                    <td width="25%" align="left"><b>:סיסמה</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" cellpadding="8" style="border-collapse:collapse;">
                                <tr>
                                    <td width="8%"></td>
                                    <td align="right"><input type="password" placeholder="אימות סיסמה" style="width:95%; text-align:right;"></td>
                                    <td width="25%" align="left"><b>:אימות סיסמה</b></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td>
                            <table border="1" width="100%" style="border-collapse:collapse;">
                                <tr height="80">
                                    <td width="8%"></td>
                                    <td></td>
                                    <td width="25%"></td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                </table>
            </td>

            <td width="15%" style="border:none;"></td>
        </tr>
    </table>

</body>
</html>
